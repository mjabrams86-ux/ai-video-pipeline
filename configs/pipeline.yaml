# Configuración del pipeline
# Modificar según tu hardware y preferencias

pipeline:
  name: "texto-a-video-lipsync"
  version: "1.0"

llm:
  # OPCIÓN A (gratis, local, SIN API key): ollama — usa el LLM de tu Mac
  provider: "ollama"         # openai | ollama
  model: "qwen3.5:4b"           # pequeño, rápido, ideal para guiones en Mac 16GB
  max_scenes: 5               # máximo de escenas por video
  language: "es"              # idioma del guion y diálogo
  api_key_env: "OPENAI_API_KEY"   # solo si provider=openai
  ollama_url: "http://localhost:11434"

tts:
  engine: "coqui"             # coqui | elevenlabs
  model: "tts_models/multilingual/multi-dataset/xtts_v2"
  language: "es"
  speaker: "Alma María"      # speaker español por defecto (ver lista con tts.speakers)
  speaker_wav: null           # ruta a audio de referencia para clonar otra voz (opcional)
  # NOTE: XTTS v2 está bajo licencia CPML (uso no comercial).

lipsync:
  # engine: latentsync (GPU NVIDIA) | musetalk (CPU ok, lento) | none (sin lip-sync)
  # En Mac Apple Silicon: LatentSync NO funciona (CUDA). Usa "musetalk" o "none".
  engine: "latentsync"
  # --- LatentSync settings ---
  inference_steps: 20         # 20-50: más = mejor calidad, más lento
  guidance_scale: 1.5
  enable_deepcache: true      # acelera ~3x en GPU
  # --- MuseTalk settings (si engine=musetalk) ---
  version: "v1.5"             # v1.0 | v1.5
  face_template: "hubert_face"
  use_exp_detection: true

compositing:
  output_resolution: "1920x1080"
  fps: 30
  codec: "libx264"
  crf: 18                     # 18=alta calidad, 23=normal, 28=baja
  audio_codec: "aac"
  transition_duration: 0.5    # segundos de crossfade entre escenas

paths:
  assets_dir: "./assets"
  output_dir: "./output"
  # Ruta al repositorio LatentSync clonado
  models_dir: "~/proyectos/LatentSync"
  # Ruta opcional a avatar PNG (se usa para video base)
  default_avatar: null
